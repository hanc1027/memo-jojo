
services:
  # Frontend - React + Nginx
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: memo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks: [frontend]         # 前端碰不到 redis 和 db
    depends_on:
      api:
        condition: service_healthy

  # Backend - Express + TypeScript
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: memo-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis          # 用 service 名稱當 hostname
      REDIS_PORT: 6379           # 容器內部的 port，不是 6380

    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Database - MySQL 8.4
  db:
    image: mysql:8.4
    container_name: memo-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Taipei

    ports:
      - "${DB_PORT:-3306}:3306"

    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro

    networks: [backend]
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.12-alpine
    container_name: memo-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 100mb
      - --maxmemory-policy
      - allkeys-lru # 設定最久沒被讀取的資料，達最大上限時會優先被刪除 (Least Recently Used)
    ports:
      - "127.0.0.1:6380:6379"   # 只給本機的 RedisInsight 用
    networks: [backend]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:

networks:
  backend:
  frontend:
